<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <img src="images/Inter.png" alt="Logo">
    </div>

    <nav class="menu">
      <button>Imágenes</button>
      <button>Servicio</button>
      <button>Contacto</button>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Tu producto aquí</h1>
  </section>

  <!-- COMENTARIO -->
  <section class="comentario">
    <p>
      “Este producto cambió completamente mi experiencia. Calidad y diseño excepcionales.”
    </p>
  </section>

  <!-- IMAGEN GRANDE -->
  <section class="imagen-destacada">
    <img src="https://via.placeholder.com/1000x500" alt="Producto">
  </section>

</body>
</html>
